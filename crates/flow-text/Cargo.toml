[package]
name = "gpui-flow-text"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
static-outlines = ["dep:ttf-parser", "dep:sha2", "dep:getrandom"]
gpui = ["dep:gpui", "dep:unicode-segmentation"]
# Registration is opt-in; Linux capability requires an explicitly selected backend.
static-outline-registration = ["gpui", "static-outlines"]
static-outline-x11 = ["static-outline-registration", "dep:gpui_platform", "gpui_platform/x11"]
static-outline-wayland = ["static-outline-registration", "dep:gpui_platform", "gpui_platform/wayland"]

[dependencies]
gpui = { workspace = true, optional = true }

unicode-segmentation = { version = "=1.13.3", optional = true }

# CPU-only outline preparation; no platform font system or independent shaper.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"], optional = true }
sha2 = { version = "=0.11.1", optional = true }
getrandom = { version = "=0.4.3", optional = true }

# Same published platform package as the workspace, with only the selected backend.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.19", default-features = false, optional = true }
