[package]
name = "gpui-flow"
version.workspace = true
edition.workspace = true
publish.workspace = true
[features]
# Opt-in Linux GPU damage adapter; its controlled backend keeps one GPUI graph.
gpu-damage = ["dep:gpui_platform", "dep:gpui_wgpu", "dep:anyhow", "dep:futures", "dep:raw-window-handle", "dep:smallvec"]
gpu-damage-oracle = ["gpu-damage", "gpui_wgpu/flow-headless"]
# Canvas glyph outlines require an explicitly registered same-App static backend.
canvas-stroke-text = ["gpui-flow-text/static-outline-registration"]

[dependencies]
gpui-flow-composite.workspace = true
gpui-flow-text = { workspace = true, features = ["gpui"] }
gpui.workspace = true
gpui-flow-core.workspace = true
gpui-flow-runtime.workspace = true
serde_json.workspace = true
gpui-kit.workspace = true
gpui-flow-scene.workspace = true
gpui-flow-editor.workspace = true
lyon = "1"
image.workspace = true

gpui-flow-media.workspace = true

gpui-flow-interaction.workspace = true

gpui-flow-engine.workspace = true

gpui-flow-layout.workspace = true

gpui-flow-animation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, optional = true }
gpui_wgpu = { workspace = true, optional = true }
anyhow = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
raw-window-handle = { version = "0.6", optional = true }
smallvec = { version = "1", optional = true }
