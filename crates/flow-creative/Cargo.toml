[package]
name = "gpui-flow-creative"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
desktop = ["dep:gpui", "dep:gpui-kit", "dep:gpui-flow"]

[dependencies]
gpui-flow-core.workspace = true
gpui-flow-interaction.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui = { workspace = true, optional = true }
gpui-kit = { workspace = true, optional = true }
gpui-flow = { workspace = true, optional = true }

[[bin]]
name = "flow-creative"
path = "src/main.rs"
required-features = ["desktop"]
