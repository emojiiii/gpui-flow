[package]
name = "gpui-flow-composite"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui-flow-core.workspace = true
gpui-flow-scene.workspace = true
# Reuse locked Gaussian and JPEG/lossless WebP codecs; no default-format bundle.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "webp"] }
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }

# Streaming PNG export shares the version used by image and resvg.
png = "=0.18.1"
# Scalar encoder for self-contained SVG image data.
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json.workspace = true

# Independent XML/readback validation; no system font lookup.
roxmltree = "=0.21.2"
resvg = { version = "=0.46.0", default-features = false, features = ["raster-images"] }
