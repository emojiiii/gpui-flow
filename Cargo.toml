[workspace]
resolver = "2"
members = ["crates/flow-creative", "crates/flow-composite", "crates/flow-text", "crates/flow-core", "crates/flow-engine", "crates/flow-layout", "crates/flow-animation", "crates/flow-interaction", "crates/flow-runtime", "crates/flow-scene", "crates/flow-editor", "crates/flow-media", "crates/flow-ui", "vendor/gpui_wgpu"]
default-members = ["crates/flow-composite", "crates/flow-text", "crates/flow-core", "crates/flow-engine", "crates/flow-layout", "crates/flow-animation", "crates/flow-interaction", "crates/flow-runtime", "crates/flow-scene", "crates/flow-editor", "crates/flow-media"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui-flow-composite = { path = "crates/flow-composite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { git = "https://github.com/longbridge/gpui-fast", rev = "26b0dccc97ebd14bbf9715741b6688132ba69491" }
gpui_platform = { git = "https://github.com/longbridge/gpui-fast", rev = "26b0dccc97ebd14bbf9715741b6688132ba69491", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_wgpu = { git = "https://github.com/longbridge/gpui-fast", rev = "26b0dccc97ebd14bbf9715741b6688132ba69491" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "4c7f1350331562436df868c55ac33bebc4c6406c" }
gpui-flow-text = { path = "crates/flow-text" }
gpui-flow-core = { path = "crates/flow-core" }
gpui-flow-engine = { path = "crates/flow-engine" }
gpui-flow-layout = { path = "crates/flow-layout" }
gpui-flow-animation = { path = "crates/flow-animation" }
gpui-flow-interaction = { path = "crates/flow-interaction" }
gpui-flow-runtime = { path = "crates/flow-runtime" }
gpui-flow = { path = "crates/flow-ui" }

gpui-flow-scene = { path = "crates/flow-scene" }
gpui-flow-editor = { path = "crates/flow-editor" }

gpui-flow-media = { path = "crates/flow-media" }

image = { version = "0.25", default-features = false }

# Gradient rasterization is a per-pixel workload used by interactive dev builds.
[profile.dev.package.gpui-flow-scene]
opt-level = 2

# Controlled Apache-2.0 backend bridge; provenance and delta are in vendor/gpui_wgpu/SOURCE.md.
[patch."https://github.com/longbridge/gpui-fast"]
gpui_wgpu = { path = "vendor/gpui_wgpu" }

# Official gpui-pre facades re-export the same locked gpui-fast core.
[patch.crates-io]
gpui-pre = { git = "https://github.com/longbridge/gpui-fast", rev = "26b0dccc97ebd14bbf9715741b6688132ba69491" }
gpui-pre-platform = { git = "https://github.com/longbridge/gpui-fast", rev = "26b0dccc97ebd14bbf9715741b6688132ba69491" }
gpui-pre-macros = { git = "https://github.com/longbridge/gpui-fast", rev = "26b0dccc97ebd14bbf9715741b6688132ba69491" }
gpui-pre-sum-tree = { git = "https://github.com/longbridge/gpui-fast", rev = "26b0dccc97ebd14bbf9715741b6688132ba69491" }
gpui-pre-web = { git = "https://github.com/longbridge/gpui-fast", rev = "26b0dccc97ebd14bbf9715741b6688132ba69491" }
