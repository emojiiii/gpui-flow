site_name: gpui-flow
site_description: Documentation for the Flow Creative desktop workbench and GPUI canvas libraries
repo_url: https://github.com/emojiiii/gpui-flow
edit_uri: ""
theme:
  name: readthedocs
  prev_next_buttons_location: none
nav:
  - Home: README.md
  - Documentation: docs/README.md
  - Getting started: docs/getting-started.md
  - Flow Creative: docs/flow-creative.md
  - Library:
      - Graph architecture: docs/architecture.md
      - Display scenes: docs/display-scenes.md
      - Custom nodes: docs/custom-nodes.md
      - Workflows: docs/workflows.md
      - Compatibility: docs/leafer-compatibility-profile.md
  - Development:
      - Tests: docs/testing.md
      - Known limitations: docs/limitations.md
      - Publishing: docs/publishing.md
  - 简体中文:
      - 项目说明: README.zh-CN.md
      - 文档目录: docs/README.zh-CN.md
      - 环境准备与入门: docs/getting-started.zh-CN.md
      - Flow Creative 操作指南: crates/flow-creative/README.md
markdown_extensions:
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
extra_javascript:
  - path: mermaid.js
    type: module
validation:
  nav:
    omitted_files: ignore
  links:
    anchors: warn
