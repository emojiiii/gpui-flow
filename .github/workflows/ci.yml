name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2

jobs:
  core:
    name: Format, core and runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            docs/examples -> target
      - name: Format workspace and documentation examples
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path docs/examples/Cargo.toml --package gpui-flow-doc-examples -- --check
      - name: Test model and runtime without a display
        run: >-
          cargo test --locked -p gpui-flow-core -p gpui-flow-interaction -p gpui-flow-runtime
          -p gpui-flow-scene -p gpui-flow-editor -p gpui-flow-engine -p gpui-flow-layout
          -p gpui-flow-animation -p gpui-flow-media -p gpui-flow-creative
          -p gpui-flow-composite -p gpui-flow-text
      - name: Lint model and runtime
        run: >-
          cargo clippy --locked -p gpui-flow-core -p gpui-flow-interaction -p gpui-flow-runtime
          -p gpui-flow-scene -p gpui-flow-editor -p gpui-flow-engine -p gpui-flow-layout
          -p gpui-flow-animation -p gpui-flow-media -p gpui-flow-creative
          -p gpui-flow-composite -p gpui-flow-text --all-targets -- -D warnings
      - name: Install FFmpeg for real decode tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test actual media decode and playback lifecycle
        env:
          SDL_AUDIODRIVER: dummy
        run: cargo test --locked -p gpui-flow-media -- --ignored --test-threads=1
      - name: Verify executable documentation
        run: |
          cargo clippy --locked --manifest-path docs/examples/Cargo.toml --all-targets -- -D warnings
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin core
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin runner
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin workflow
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin plugins
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin layout
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin animation
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin auto_size
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin state_styles
          cargo run --locked --manifest-path docs/examples/Cargo.toml --bin reactive_layout

  native:
    name: Native UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang libclang-dev \
            fonts-dejavu-core fonts-dejavu-extra \
            libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 mesa-vulkan-drivers libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libzstd-dev xauth xvfb
      - name: Verify macOS SDK
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --find clang
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.os }}
      - name: Check all workspace targets with Creative desktop
        run: cargo check --locked --workspace --all-targets --features gpui-flow-creative/desktop
      - name: Lint full workspace with Creative desktop
        run: cargo clippy --locked --workspace --all-targets --features gpui-flow-creative/desktop -- -D warnings
      - name: Test Creative project workflows on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked -p gpui-flow-creative --lib
      # GPUI's Windows headless text system is a no-op and macOS needs the main
      # thread for its platform. Linux runs the full UI suite with real fonts.
      - name: Test portable UI components
        if: runner.os != 'Linux'
        run: >-
          cargo test --locked -p gpui-flow --lib --
          canvas:: scene_view:: components:: layered_app::
      - name: Test Linux UI and software GPU rendering
        if: runner.os == 'Linux'
        shell: bash
        run: |
          driver=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${driver[0]}"
          export VK_DRIVER_FILES="${driver[0]}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gpui-flow-xdg"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          cargo test --locked -p gpui-flow --features gpu-damage-oracle --lib
          env -u WAYLAND_DISPLAY xvfb-run -a -s '-screen 0 1600x900x24' \
            cargo test --locked -p gpui-flow --features gpu-damage-oracle --lib \
            gpu_damage::native_tests::native_flow_paint_persistent_gpu_rgba_and_work \
            -- --exact --ignored --test-threads=1
      - name: Link creative workbench
        run: cargo build --locked -p gpui-flow-creative --features desktop --bin flow-creative
      # Never run provider calls, upload graphs, or require production secrets in CI.
